# Sveltia CMS. Sign in with a GitHub fine-grained token (Contents: read/write on
# leotsgo/blog); saving commits to main, which triggers the deploy workflow.
backend:
  name: github
  repo: leotsgo/blog
  branch: main
  # Same style as the hand-written commits. {{collection}} is the collection's
  # label_singular.
  commit_messages:
    create: "content({{collection}}): add {{slug}}"
    update: "content({{collection}}): update {{slug}}"
    delete: "content({{collection}}): remove {{slug}}"
    uploadMedia: "content(media): upload {{path}}"
    deleteMedia: "content(media): remove {{path}}"

media_folder: static/images
public_folder: /images

i18n:
  structure: multiple_files
  locales: [en, pt-br]
  default_locale: en
  # foo.md is English, foo.pt-br.md is Portuguese — Hugo's filename convention.
  omit_default_locale_from_file_path: true

collections:
  - name: posts
    label: Posts
    label_singular: post
    folder: content/posts
    create: true
    format: toml-frontmatter
    slug: "{{title}}"
    i18n: true
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: date, label: Date, widget: datetime, i18n: duplicate }
      - { name: draft, label: Draft, widget: boolean, default: true, i18n: duplicate }
      - { name: authors, label: Author, widget: string, default: Leonardo Bermejo, i18n: duplicate }
      - { name: categories, label: Categories, widget: list, required: false, i18n: duplicate }
      - { name: tags, label: Tags, widget: list, required: false, i18n: duplicate }
      - { name: body, label: Body, widget: markdown, i18n: true }

  - name: pages
    label: Pages
    label_singular: page
    format: toml-frontmatter
    i18n: true
    files:
      - name: about
        label: About
        file: content/about.{{locale}}.md
        i18n: true
        fields: &page
          - { name: title, label: Title, widget: string, required: false, i18n: true }
          - { name: date, label: Date, widget: datetime, required: false, i18n: duplicate }
          - { name: authors, label: Author, widget: string, required: false, i18n: duplicate }
          - { name: body, label: Body, widget: markdown, i18n: true }
      - name: now
        label: Now
        file: content/now.{{locale}}.md
        i18n: true
        fields: *page
      - name: contact
        label: Contact
        file: content/contact.{{locale}}.md
        i18n: true
        fields: *page

  # Homepage: Hugo merges these with hugo.toml; params.pt-br.toml overrides the
  # translated fields for /pt-br/. Untranslated fields live only in params.toml.
  - name: site
    label: Site settings
    label_singular: site
    format: toml
    i18n: true
    files:
      - name: home
        label: Homepage
        file: config/_default/params.{{locale}}.toml
        i18n: true
        fields:
          - { name: author, label: Name, widget: string }
          - { name: info, label: Tagline, widget: string, i18n: true }
          - { name: description, label: Description, widget: string, i18n: true }
          - { name: avatarURL, label: Avatar, widget: image }
          - name: social
            label: Social links
            label_singular: link
            widget: list
            summary: "{{name}} — {{url}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: url, label: URL, widget: string }
              - { name: icon, label: Icon, widget: string, hint: "Font Awesome classes, e.g. fa-brands fa-github fa-2x" }
              - { name: weight, label: Order, widget: number, value_type: int }
              - { name: rel, label: rel, widget: string, required: false }
              - { name: type, label: type, widget: string, required: false }
