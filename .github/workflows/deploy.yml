# Same shape as hopwing/undefined-game's deploy: build and push the image, then
# bump its tag in leotsgo/homelab; Flux ships it. GitHub-hosted runner, since
# this repo is public.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/leotsgo/blog

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ship:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: bump the image tag in leotsgo/homelab
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_TOKEN }}
          TAG: ${{ needs.image.outputs.tag }}
          FILE: apps/base/blog/deployment.yml
        run: |
          api="https://api.github.com/repos/leotsgo/homelab/contents/$FILE"
          sha=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api" \
            | grep -o '"sha": *"[^"]*"' | head -1 | sed 's/.*: *"//; s/"//')
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" "$api" > old.yml
          sed "s|${IMAGE}:[^\"' ]*|${IMAGE}:${TAG}|" old.yml > new.yml
          grep -q "${IMAGE}:${TAG}" new.yml || { echo "tag replacement failed in $FILE"; diff old.yml new.yml; exit 1; }
          content=$(base64 -w0 new.yml)
          curl -fsSL -X PUT -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"message\":\"chore(deps): update blog to ${TAG}\",\"content\":\"$content\",\"sha\":\"$sha\"}" \
            "$api" > /dev/null
