{{/* Theme override: inline SVG icons via partials/icon.html. */}}
<div class="tags">
  {{ partial "icon.html" "fa-solid fa-tag" }}
  {{- range $index, $el := . -}}
    {{- if gt $index 0 }}
      <span class="separator">•</span>
    {{- end }}
    <span class="tag">
      <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    </span>
  {{- end -}}
</div>
