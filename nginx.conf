# Security headers live here, not in a Traefik Middleware: public traffic comes
# through cloudflared straight to the Service and never touches the gateway.
server {
    listen 80;
    root /usr/share/nginx/html;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The CMS is tailnet-only. Cloudflare stamps CF-Connecting-IP on every
    # request that comes through the tunnel; tailnet/LAN requests reach nginx
    # through the Traefik gateway, which never adds it.
    location /admin/ {
        if ($http_cf_connecting_ip) {
            return 404;
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
